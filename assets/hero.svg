<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="titleDesc">
  <title id="titleDesc">Cover image for CV: Agnes Lilla Ladoczki-Szabo — Software Tester & Developer</title>
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#0b2545"/>
      <stop offset="100%" stop-color="#07203a"/>
    </linearGradient>
    <pattern id="code" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="transparent"/>
      <text x="8" y="28" font-family="monospace" font-size="20" fill="rgba(255,255,255,0.04)">{ }</text>
      <text x="8" y="58" font-family="monospace" font-size="20" fill="rgba(255,255,255,0.03)">;&nbsp;&nbsp;</text>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.03 0 0 0 0 0.12 0 0 0 0 0.18 0 0 0 0.6 0"/>
    </filter>
  </defs>

  <!-- background gradient -->
  <rect width="100%" height="100%" fill="url(#g)" />

  <!-- subtle code-pattern overlay -->
  <rect width="100%" height="100%" fill="url(#code)" opacity="0.6" />

  <!-- decorative blurred shapes -->
  <g filter="url(#soft)">
    <circle cx="960" cy="80" r="140" fill="#1f6feb" opacity="0.28"/>
    <ellipse cx="200" cy="200" rx="260" ry="120" fill="#00b4d8" opacity="0.10"/>
  </g>

  <!-- left column: name and title -->
  <g transform="translate(80,80)" fill="#ffffff">
    <text x="0" y="0" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="36" font-weight="700">Agnes Lilla Ladoczki-Szabo</text>
    <text x="0" y="48" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="20" fill="#d1e8ff">Software Tester & Developer</text>
    <rect x="0" y="76" width="420" height="2" fill="#1f6feb" rx="1"/>
    <text x="0" y="116" font-family="monospace" font-size="14" fill="#bcd9ff">Manual testing • Test automation • CI/CD • Selenium • Postman</text>
  </g>

  <!-- right column: simple laptop / code icon -->
  <g transform="translate(740,100)">
    <rect x="0" y="36" width="320" height="160" rx="8" fill="#071133" opacity="0.9" stroke="#123456"/>
    <rect x="12" y="52" width="296" height="100" rx="4" fill="#021028"/>
    <!-- code lines -->
    <rect x="24" y="64" width="240" height="8" rx="4" fill="#0ea5e9" opacity="0.95"/>
    <rect x="24" y="80" width="200" height="8" rx="4" fill="#7dd3fc" opacity="0.85"/>
    <rect x="24" y="96" width="160" height="8" rx="4" fill="#0ea5e9" opacity="0.75"/>
    <!-- keyboard base -->
    <rect x="0" y="198" width="320" height="20" rx="4" fill="#001227"/>
  </g>

  <!-- footer note -->
  <text x="40" y="340" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#9fb6d9">Portfolio / CV cover — replace or edit `assets/hero.svg` for a custom image</text>
</svg>
